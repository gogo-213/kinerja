<script>
// --- Pemeriksaan Status Login (User atau Admin) ---
const LOGIN_PAGE_URL = 'login.html'; 

if (localStorage.getItem('isUserLoggedIn') !== 'true' && localStorage.getItem('isAdminLoggedIn') !== 'true') {
    window.location.href = LOGIN_PAGE_URL;
}

function logout() {
    if (confirm('Anda yakin ingin keluar dari aplikasi?')) {
        localStorage.removeItem('isAdminLoggedIn'); // Hapus keduanya jika ada
        localStorage.removeItem('isUserLoggedIn');
        window.location.href = LOGIN_PAGE_URL;
    }
}
// ------------------------------------------

const { jsPDF } = window.jspdf;
function $(id){ return document.getElementById(id); }

// --- KONSTANTA & INISIALISASI DATA (Diambil dari index.html) ---
const STORAGE_KEY = 'bp2jk_performance_data';
const STORAGE_KEY_EMPS = 'bp2jk_employee_names';

const divisions = ["Kep. Balai", "Kasubag TU", "Pokja", "Tim Peneliti", "Tim Pelaksana", "Kesatkeran", "Staff", "Outsourcing"]; 
const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const productionDivisions = ['Pokja', 'Tim Peneliti', 'Tim Pelaksana'];

const TARGET_NOMINAL_POKJA = 250000000000; 
const TARGET_NOMINAL_KESATKERAN = 1000000000; 

const baseWeights = { 
    'Kep. Balai': { wCount: 0, wValue: 0, wAbs: 10, wTeam: 45, wKom: 45 },
    'Kasubag TU': { wCount: 0, wValue: 0, wAbs: 10, wTeam: 45, wKom: 45 },
    'Pokja': { wCount: 32, wValue: 38, wAbs: 10, wTeam: 10, wKom: 10 }, 
    'Tim Peneliti': { wCount: 32, wValue: 38, wAbs: 10, wTeam: 10, wKom: 10 },
    'Tim Pelaksana': { wCount: 32, wValue: 38, wAbs: 10, wTeam: 10, wKom: 10 },
    'Staff': { wCount: 0, wValue: 0, wAbs: 30, wTeam: 35, wKom: 35 },
    'Outsourcing': { wCount: 0, wValue: 0, wAbs: 30, wTeam: 35, wKom: 35 },
    'Kesatkeran': { wCount: 0, wValue: 40, wAbs: 10, wTeam: 25, wKom: 25 } 
};

// Global variables
let db = []; 
let uniqueEmployeeNames = []; 
const ROWS_PER_PAGE = 10;
let currentPage = 1;
let filteredData = []; 
let globalAvgScore = 0; 


// --- FUNGSI LOCAL STORAGE (Data Persistence) ---

function fetchData() {
    const dataKinerja = localStorage.getItem(STORAGE_KEY);
    db = dataKinerja ? JSON.parse(dataKinerja) : [];

    const dataEmps = localStorage.getItem(STORAGE_KEY_EMPS);
    uniqueEmployeeNames = dataEmps ? JSON.parse(dataEmps) : [];
}

function formatRupiah(num){
    if (isNaN(num) || num === 0) return 'Rp 0';
    return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR'}).format(num).replace(',00','');
}

// --- FUNGSI UTAMA (Dropdowns dan Render) ---

function initDropdowns() {
    const searchDivisionSelect = $('searchDivision');
    const searchMonthSelect = $('searchMonth');
    const searchYearSelect = $('searchYear');
    
    searchDivisionSelect.innerHTML = '<option value="">-- Semua Divisi --</option>';

    divisions.forEach(p => {
        searchDivisionSelect.innerHTML += `<option value="${p}">${p}</option>`;
    });

    for(let m=0; m<12; m++){
        const val = m + 1;
        searchMonthSelect.innerHTML += `<option value="${val}">${monthNames[m]}</option>`;
    }

    const currentYear = new Date().getFullYear();
    const startYear = 2025; 
    const endYear = currentYear + 5; 
    searchYearSelect.innerHTML = '<option value="">-- Semua Tahun --</option>';

    for(let y = startYear; y <= endYear; y++){
        searchYearSelect.innerHTML += `<option value="${y}">${y}</option>`;
    }
}

function populateNameDropdowns() {
    const searchNameSelect = $('searchName');
    const currentSearchName = searchNameSelect.value;
    
    searchNameSelect.innerHTML = '<option value="">-- Semua Pegawai --</option>';
    uniqueEmployeeNames.forEach(name => {
        const selected = name === currentSearchName ? 'selected' : '';
        searchNameSelect.innerHTML += `<option value="${name}" ${selected}>${name}</option>`;
    });
    if (uniqueEmployeeNames.includes(currentSearchName)) {
        searchNameSelect.value = currentSearchName;
    }
}


// --- FUNGSI PERHITUNGAN SKOR (Untuk RENDER DASHBOARD) ---

function getWeights(division) {
    return baseWeights[division] || baseWeights['Pokja'];
}

function calculateScore(tc, tv, ab, tw, km, division, inputNominalRupiah) {
    const { wCount, wValue, wAbs, wTeam, wKom } = getWeights(division); 
    const w1 = wCount, w2 = wValue, w3 = wAbs, w4 = wTeam, w5 = wKom;
    const isProduction = productionDivisions.includes(division);
    const targetNominal = isProduction ? TARGET_NOMINAL_POKJA : TARGET_NOMINAL_KESATKERAN;

    let sCount = 0;
    if (w1 > 0) sCount = Math.min(100, (tc / 5) * 100); 
    
    let sValue = 0;
    if (w2 > 0) sValue = inputNominalRupiah > 0 ? Math.min(100, (inputNominalRupiah / targetNominal) * 100) : 0; 
    
    let sAbs = ab * 10;
    
    let sTeam, sKom;
    
    if (division === 'Kep. Balai' || division === 'Kasubag TU') {
        let globalScoreNormalized = globalAvgScore; 
        sTeam = globalScoreNormalized; 
        sKom = globalScoreNormalized; 
        if (globalAvgScore === 0) { sTeam = 0; sKom = 0; }
    } else {
        sTeam = tw * 10;
        sKom = km * 10;
    }

    let finalScore = (
        sCount * w1/100 + 
        sValue * w2/100 + 
        sAbs * w3/100 +   
        sTeam * w4/100 +  
        sKom * w5/100     
    );

    return { finalScore: finalScore.toFixed(1), sTeamRaw: sTeam, sKomRaw: sKom };
}


// --- FUNGSI CHART & RENDER ---

let overallChartInstance = null;
let divisionChartInstance = null;

function updateCharts() {
    // Bagian ini sama persis dengan index.html untuk memastikan konsistensi perhitungan
    let totalScore = 0;
    let totalCount = 0;
    
    db.forEach(d => {
        const score = parseFloat(d.finalScore);
        if (!isNaN(score)) { totalScore += score; totalCount++; }
    });

    globalAvgScore = totalCount > 0 ? (totalScore / totalCount) : 0;
    
    // Recalculate leadership scores based on new globalAvgScore (Penting untuk data Kep. Balai/Kasubag TU)
    db.forEach(d => {
        if (d.division === 'Kep. Balai' || d.division === 'Kasubag TU') {
            const { finalScore, sTeamRaw, sKomRaw } = calculateScore(0, 0, d.ab_raw, 0, 0, d.division, 0);
            d.finalScore = finalScore;
            d.tw_raw = sTeamRaw; 
            d.km_raw = sKomRaw;
        }
    });
    
    const monthlyStats = Array(12).fill(0).map(() => ({ total: 0, count: 0 }));
    const divStats = {};
    divisions.forEach(d => divStats[d] = { total: 0, count: 0 });

    db.forEach(d => {
        const score = parseFloat(d.finalScore);
        const mIdx = parseInt(d.month) - 1;
        if (mIdx >= 0 && mIdx < 12) {
            monthlyStats[mIdx].total += score;
            monthlyStats[mIdx].count++;
        }
        if (divStats.hasOwnProperty(d.division)) {
            divStats[d.division].total += score;
            divStats[d.division].count++;
        }
    });

    const monthlyAvgs = monthlyStats.map(s => s.count > 0 ? (s.total / s.count).toFixed(1) : 0);
    const divAvgs = divisions.map(d => {
        const s = divStats[d];
        return s.count > 0 ? (s.total / s.count).toFixed(1) : 0;
    });

    const allAverages = [...monthlyAvgs.map(Number), ...divAvgs.map(Number)].filter(n => n > 0);
    let chartMax = 100; 
    if (allAverages.length > 0) {
        const maxData = Math.max(...allAverages);
        chartMax = Math.min(100, Math.ceil((maxData * 1.05) / 5) * 5); 
    }
    
    const ctx1 = document.getElementById('overallChart').getContext('2d');
    if (overallChartInstance) overallChartInstance.destroy(); 
    overallChartInstance = new Chart(ctx1, {
        type: 'line',
        data: {
            labels: monthNames,
            datasets: [{
                label: 'Rata-rata Kinerja (Semua Pegawai)',
                data: monthlyAvgs,
                borderColor: '#007bff',
                backgroundColor: 'rgba(0, 123, 255, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, max: chartMax, title: { display: true, text: 'Skor' } } }
        }
    });

    const ctx2 = document.getElementById('divisionChart').getContext('2d');
    if (divisionChartInstance) divisionChartInstance.destroy();
    const barColors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#009688', '#FF5722']; 
    divisionChartInstance = new Chart(ctx2, {
        type: 'bar',
        data: {
            labels: divisions,
            datasets: [{
                label: 'Rata-rata Skor',
                data: divAvgs,
                backgroundColor: barColors,
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, max: chartMax } },
            plugins: { legend: { display: false } }
        }
    });
}

function changePage(delta) {
    const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
    const newPage = currentPage + delta;

    if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        renderTable(); 
        window.scrollTo({ top: document.querySelector('table').offsetTop - 20, behavior: 'smooth' });
    }
}

function renderTable() {
    const startIndex = (currentPage - 1) * ROWS_PER_PAGE;
    const endIndex = startIndex + ROWS_PER_PAGE;
    const dataToDisplay = filteredData.slice(startIndex, endIndex);
    const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);

    $('dataBody').innerHTML = '';
    
    if (dataToDisplay.length === 0 && filteredData.length === 0) {
        $('dataBody').innerHTML = `<tr><td colspan="8" style="text-align:center; color: #dc3545;">Tidak ada data yang cocok dengan kriteria pencarian.</td></tr>`;
    } else {
        dataToDisplay.forEach((d, i)=>{
            const displayMonth = monthNames[parseInt(d.month) - 1]; 
            
            $('dataBody').innerHTML += `
                <tr>
                    <td>${i + startIndex + 1}</td> <td>${d.name}</td>
                    <td>${d.division || '-'}</td> <td>${displayMonth}</td>
                    <td>${d.year}</td>
                    <td style="text-align: right;">${d.tc_raw || '-'}</td>
                    <td style="text-align: right;">${formatRupiah(d.tv_raw || 0)}</td>
                    <td>${d.finalScore}</td>
                    <td></td> </tr>`;
        });
    }

    const prevButton = $('prevPage');
    const nextButton = $('nextPage');
    const pageInfo = $('pageInfo');
    
    if (filteredData.length > ROWS_PER_PAGE) {
        prevButton.style.display = 'inline-block';
        nextButton.style.display = 'inline-block';

        prevButton.disabled = currentPage === 1;
        nextButton.disabled = currentPage === totalPages;

        prevButton.style.backgroundColor = currentPage === 1 ? '#ccc' : '#007bff';
        nextButton.style.backgroundColor = currentPage === totalPages ? '#ccc' : '#007bff';

        pageInfo.textContent = `Halaman ${currentPage} dari ${totalPages} (${filteredData.length} data)`;
    } else {
        prevButton.style.display = 'none';
        nextButton.style.display = 'none';
        pageInfo.textContent = filteredData.length > 0 ? `Total ${filteredData.length} data` : '';
    }
}


function render(){
    fetchData();
    populateNameDropdowns();
    updateCharts(); 

    const searchQuery = $('searchName').value.toLowerCase();
    const searchDivision = $('searchDivision').value; 
    const searchMonth = $('searchMonth').value;
    const searchYear = $('searchYear').value;

    filteredData = db.filter(d => {
        const nameMatch = searchQuery === '' || (d.name && d.name.toLowerCase().includes(searchQuery));
        const divisionMatch = searchDivision === '' || d.division === searchDivision; 
        const monthMatch = searchMonth === '' || d.month.toString() === searchMonth;
        const yearMatch = searchYear === '' || d.year.toString() === searchYear;

        return nameMatch && divisionMatch && monthMatch && yearMatch;
    });
    
    currentPage = 1;
    renderTable();
}

// --- FUNGSI EXPORT (Sama seperti index.html) ---

function workbookToS2ab(workbook) {
    const wopts = { bookType: 'xlsx', bookSST: false, type: 'binary' };
    const ws = XLSX.write(workbook, wopts);
    function s2ab(s) {
        const buf = new ArrayBuffer(s.length);
        const view = new Uint8Array(buf);
        for (let i = 0; i < s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
        return buf;
    }
    return new Blob([s2ab(ws)], { type: 'application/octet-stream' });
}

function exportDataToExcel(data, filename) {
    if (typeof XLSX === 'undefined') {
        alert("Gagal export. Pastikan library XLSX.js telah dimuat.");
        return;
    }

    const exportData = data.map((d, index) => ({
        'No.': index + 1,
        'Nama Pegawai': d.name,
        'Divisi': d.division || '-',
        'Bulan': monthNames[parseInt(d.month) - 1],
        'Tahun': d.year,
        'Jml. Pekerjaan': d.tc_raw || '-',
        'Nominal Pekerjaan (Rp)': d.tv_raw || 0,
        'Skor Akhir': d.finalScore
    }));
    
    const worksheet = XLSX.utils.json_to_sheet(exportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, 'Data Kinerja');
    
    const blob = workbookToS2ab(workbook);
    saveAs(blob, filename + '.xlsx');
}

function saveAs(blob, filename) {
    const a = document.createElement('a');
    a.href = window.URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(a.href);
}

function exportAllDataToExcel() {
    exportDataToExcel(db, 'Laporan_Kinerja_All');
}

function exportFilteredDataToExcel() {
    exportDataToExcel(filteredData, 'Data_Tersimpan_Filtered');
}

}

}
