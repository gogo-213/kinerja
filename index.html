<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login Admin - Aplikasi Penilaian Kinerja</title>
<style>
/* Reset & Typography */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); /* Gradien Biru Khas Aplikasi */
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

/* Container Login */
.login-container {
    background-color: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 400px; /* Lebar maksimum formulir */
    text-align: center;
}

/* Header */
.login-header {
    margin-bottom: 30px;
}
.login-header h2 {
    color: #007bff;
    margin: 0;
    font-size: 2em;
}
.login-header p {
    color: #555;
    margin-top: 5px;
    font-size: 1em;
}

/* Form Styling */
.input-group {
    margin-bottom: 20px;
    text-align: left;
}
.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #555;
}
.input-group input[type="text"],
.input-group input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.input-group input:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    outline: none;
}

/* Button Styling */
#loginButton {
    width: 100%;
    padding: 14px;
    background-color: #28a745; /* Warna Hijau untuk Aksi Utama */
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1.1em;
    font-weight: bold;
    transition: background-color 0.3s;
}
#loginButton:hover {
    background-color: #1e7e34;
}
#loginButton:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}

/* Pesan Error */
#message {
    margin-top: 15px;
    color: #dc3545;
    font-weight: 600;
    min-height: 20px;
}

/* Footer */
.login-footer {
    margin-top: 30px;
    color: #888;
    font-size: 0.85em;
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h2>Administrator Login 🔑</h2>
        <p>Aplikasi Penilaian Kinerja Pegawai BP2JK DIY</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
        <div class="input-group">
            <label for="nip">NIP (Nomor Induk Pegawai):</label>
            <input type="text" id="nip" placeholder="Masukkan NIP Anda" required />
        </div>
        <div class="input-group">
            <label for="pin">PIN:</label>
            <input type="password" id="pin" placeholder="Masukkan PIN Anda" required />
        </div>
        
        <button type="submit" id="loginButton">Masuk</button>
        <div id="message"></div>
    </form>

    <div class="login-footer">
        Harap hubungi Administrator Sistem jika mengalami masalah.
    </div>
</div>

<script>
// URL Web App Google Apps Script Anda (Sama dengan API_URL di file utama)
const LOGIN_API_URL = 'https://script.google.com/macros/s/AKfycby-fxM045hDCYEmk3PosCtZ4E6xXzNKm7Wq_8Mu2xakyUFHMAxhh4TWgnvs7bbsk7Ye/exec'; 
const MAIN_APP_URL = 'index.html'; // Ganti jika nama file utama berbeda

/**
 * Mengirim kredensial login ke Google Apps Script untuk divalidasi.
 */
async function handleLogin() {
    const nip = document.getElementById('nip').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const loginButton = document.getElementById('loginButton');
    const message = document.getElementById('message');

    if (!nip || !pin) {
        message.textContent = 'NIP dan PIN harus diisi.';
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = 'Memverifikasi...';
    message.textContent = '';

    try {
        // Logika di bawah ini adalah placeholder.
        // Anda HARUS mengimplementasikan validasi NIP dan PIN di Google Apps Script.
        const payload = { 
            action: 'login', 
            nip: nip, 
            pin: pin 
        };

        // Mengirim request ke API
        const response = await fetch(LOGIN_API_URL, {
            method: 'POST',
            mode: 'no-cors', // Mode ini mungkin diperlukan untuk Apps Script POST tanpa CORS
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        });

        // Karena menggunakan 'no-cors', response.json() akan error.
        // Sebaiknya Apps Script diatur untuk mengembalikan redirect atau respon teks sederhana.
        // Untuk contoh ini, kita asumsikan jika fetch berhasil, kita tunggu sebentar dan cek.

        await new Promise(resolve => setTimeout(resolve, 1000)); // Simulasi jeda server

        // --- ASUMSI VALIDASI SUKSES (ANDA HARUS MENGGANTINYA DENGAN LOGIKA NYATA) ---
        // Contoh: NIP 123456 dan PIN 1122 adalah valid
        if (nip === "123456" && pin === "1122") {
            message.textContent = 'Login Berhasil! Mengarahkan ke Dashboard...';
            message.style.color = '#28a745';
            // Simpan status login (misalnya di localStorage untuk aplikasi sederhana)
            localStorage.setItem('isAdminLoggedIn', 'true'); 
            window.location.href = MAIN_APP_URL; // Arahkan ke halaman utama
        } else {
            message.textContent = 'NIP atau PIN salah. Silakan coba lagi.';
            message.style.color = '#dc3545';
        }
        // --------------------------------------------------------------------------

    } catch (error) {
        console.error('Login Gagal:', error);
        message.textContent = 'Terjadi kesalahan jaringan atau server. Cek konsol.';
        message.style.color = '#dc3545';
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Masuk';
    }
}


// Cek apakah sudah login saat halaman dimuat (opsional)
// document.addEventListener('DOMContentLoaded', () => {
//     if (localStorage.getItem('isAdminLoggedIn') === 'true') {
//         window.location.href = MAIN_APP_URL;
//     }
// });

</script>
</body>
</html>
