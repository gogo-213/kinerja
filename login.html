<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - Aplikasi Penilaian Kinerja</title>
<style>
/* --- CSS LOGIN --- */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); 
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.login-container {
    background-color: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 400px; 
    text-align: center;
}
.login-header {
    margin-bottom: 30px;
}
.login-header h2 {
    color: #007bff;
    margin: 0;
    font-size: 2em;
}
.login-header p {
    color: #555;
    margin-top: 5px;
    font-size: 1em;
}
.input-group {
    margin-bottom: 20px;
    text-align: left;
}
.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #555;
}
.input-group input[type="text"],
.input-group input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.input-group input:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    outline: none;
}
#loginAdminButton, #loginUserButton {
    width: 100%;
    padding: 14px;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1.1em;
    font-weight: bold;
    transition: background-color 0.3s;
    margin-top: 10px;
}
#loginAdminButton {
    background-color: #007bff; 
}
#loginAdminButton:hover {
    background-color: #0056b3;
}
#loginUserButton {
    background-color: #28a745; 
}
#loginUserButton:hover {
    background-color: #1e7e34;
}
#loginAdminButton:disabled, #loginUserButton:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}
#message {
    margin-top: 15px;
    color: #dc3545;
    font-weight: 600;
    min-height: 20px;
}
.login-footer {
    margin-top: 30px;
    color: #888;
    font-size: 0.85em;
}
/* --- AKHIR CSS LOGIN --- */
</style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h2>Login Aplikasi Kinerja 🔑</h2>
        <p>Balai Pelaksana Pemilihan Jasa Konstruksi (BP2JK) DIY</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault();">
        <div class="input-group">
            <label for="nip">NIP (Nomor Induk Pegawai):</label>
            <input type="text" id="nip" placeholder="Masukkan NIP Anda" required />
        </div>
        <div class="input-group">
            <label for="pin">PIN:</label>
            <input type="password" id="pin" placeholder="Masukkan PIN Anda" required />
        </div>
        
        <button type="button" id="loginAdminButton" onclick="handleLogin('admin')">Masuk sebagai Administrator</button>
        <button type="button" id="loginUserButton" onclick="handleLogin('user')">Lihat Dashboard (User)</button>
        <div id="message"></div>
    </form>

    <div class="login-footer">
        Harap hubungi Administrator Sistem jika mengalami masalah.
    </div>
</div>

<script>
const ADMIN_APP_URL = 'index.html';
const USER_APP_URL = 'user.html';

// ⚠️ WAJIB DIGANTI! GANTI DENGAN URL WEB APP APPS SCRIPT ANDA
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzzzz/exec'; 

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('isAdminLoggedIn') === 'true') {
        window.location.href = ADMIN_APP_URL;
    } else if (localStorage.getItem('isUserLoggedIn') === 'true') {
        window.location.href = USER_APP_URL;
    }
});

function setButtonState(disabled, text) {
    document.getElementById('loginAdminButton').disabled = disabled;
    document.getElementById('loginUserButton').disabled = disabled;
    if (text) {
        document.getElementById('loginAdminButton').textContent = text;
        document.getElementById('loginUserButton').textContent = text;
    } else {
        document.getElementById('loginAdminButton').textContent = 'Masuk sebagai Administrator';
        document.getElementById('loginUserButton').textContent = 'Lihat Dashboard (User)';
    }
}

function handleLogin(role) {
    const nip = document.getElementById('nip').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const message = document.getElementById('message');

    if (!nip || !pin) {
        message.textContent = 'NIP dan PIN harus diisi.';
        return;
    }

    setButtonState(true, 'Memverifikasi...');
    message.textContent = 'Memverifikasi...';
    message.style.color = '#007bff';

    const url = `${APPS_SCRIPT_URL}?nip=${encodeURIComponent(nip)}&pin=${encodeURIComponent(pin)}`;

    fetch(url)
        .then(response => {
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.indexOf("application/json") !== -1) {
                return response.json();
            } else {
                // Apps Script sering mengirim HTML/teks error jika terjadi masalah
                throw new Error('Gagal terhubung ke Apps Script atau respon tidak valid.');
            }
        })
        .then(data => {
            if (data.success) {
                let redirectURL = null;
                let loginKey = null;

                // Jika tombol Admin diklik DAN peran yang dikembalikan adalah admin
                if (role === 'admin' && data.role === 'admin') {
                    redirectURL = ADMIN_APP_URL;
                    loginKey = 'isAdminLoggedIn';
                } 
                // Jika tombol User diklik DAN peran yang dikembalikan adalah admin atau user
                else if (role === 'user' && (data.role === 'admin' || data.role === 'user')) {
                    redirectURL = USER_APP_URL;
                    loginKey = 'isUserLoggedIn';
                } else {
                    message.textContent = 'Anda tidak memiliki hak akses yang diminta.';
                }

                if (redirectURL) {
                    message.textContent = 'Login Berhasil! Mengarahkan...';
                    message.style.color = '#28a745';
                    localStorage.removeItem('isAdminLoggedIn');
                    localStorage.removeItem('isUserLoggedIn');
                    localStorage.setItem(loginKey, 'true');
                    setTimeout(() => {
                        window.location.href = redirectURL;
                    }, 1000);
                    return;
                }

            } else {
                message.textContent = 'NIP atau PIN salah.';
            }
            
            message.style.color = '#dc3545';
            setButtonState(false);
        })
        .catch(error => {
            console.error('Error:', error);
            message.textContent = 'Gagal terhubung ke server verifikasi. Cek koneksi & URL Apps Script.';
            message.style.color = '#dc3545';
            setButtonState(false);
        });
}
</script>
</body>
</html>
