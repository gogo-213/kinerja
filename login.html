<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - Aplikasi Penilaian Kinerja</title>
<style>
/* --- CSS LOGIN --- */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); 
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.login-container {
    background-color: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 400px; 
    text-align: center;
}
.login-header {
    margin-bottom: 30px;
}
.login-header h2 {
    color: #007bff;
    margin: 0;
    font-size: 2em;
}
.login-header p {
    color: #555;
    margin-top: 5px;
    font-size: 1em;
}
.input-group {
    margin-bottom: 20px;
    text-align: left;
}
.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #555;
}
.input-group input[type="text"],
.input-group input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.input-group input:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    outline: none;
}
#loginAdminButton, #loginUserButton {
    width: 100%;
    padding: 14px;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1.1em;
    font-weight: bold;
    transition: background-color 0.3s;
    margin-top: 10px;
}
#loginAdminButton {
    background-color: #007bff; 
}
#loginAdminButton:hover {
    background-color: #0056b3;
}
#loginUserButton {
    background-color: #28a745; 
}
#loginUserButton:hover {
    background-color: #1e7e34;
}
#loginAdminButton:disabled, #loginUserButton:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}
#message {
    margin-top: 15px;
    color: #dc3545;
    font-weight: 600;
    min-height: 20px;
}
.login-footer {
    margin-top: 30px;
    color: #888;
    font-size: 0.85em;
}
/* --- AKHIR CSS LOGIN --- */
</style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h2>Login Aplikasi Kinerja 🔑</h2>
        <p>Balai Pelaksana Pemilihan Jasa Konstruksi (BP2JK) DIY</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault();">
        <div class="input-group">
            <label for="nip">NIP (Nomor Induk Pegawai):</label>
            <input type="text" id="nip" placeholder="Masukkan NIP Anda" required />
        </div>
        <div class="input-group">
            <label for="pin">PIN:</label>
            <input type="password" id="pin" placeholder="Masukkan PIN Anda" required />
        </div>
        
        <button type="button" id="loginAdminButton" onclick="handleLogin('admin')">Masuk sebagai Administrator</button>
        <button type="button" id="loginUserButton" onclick="handleLogin('user')">Lihat Dashboard (User)</button>
        <div id="message"></div>
    </form>

    <div class="login-footer">
        Harap hubungi Administrator Sistem jika mengalami masalah.
    </div>
</div>

<script>
const ADMIN_APP_URL = 'index.html';
const USER_APP_URL = 'user.html';

// ⚠️ KONFIGURASI ADMIN & USER
const ADMIN_CREDENTIALS = [
    { nip: '197906192010121002', pin: '112244' },                   // Admin 1 (Contoh Singkat)
    { nip: '198710312010122002', pin: '093346' }     // Admin 2
];
// Untuk USER, hanya perlu PIN dan NIP untuk otentikasi.
// Semua NIP/PIN selain yang ada di ADMIN_CREDENTIALS akan dianggap sebagai USER.
const USER_CREDENTIALS = [
    { nip: '1234567', pin: '123456' }, // Contoh user 1
    { nip: '2345678', pin: '234567' }  // Contoh user 2
];


document.addEventListener('DOMContentLoaded', () => {
    // Redirect jika status login sudah ada
    if (localStorage.getItem('isAdminLoggedIn') === 'true') {
        window.location.href = ADMIN_APP_URL;
    } else if (localStorage.getItem('isUserLoggedIn') === 'true') {
        window.location.href = USER_APP_URL;
    }
});

function setButtonState(disabled, text) {
    document.getElementById('loginAdminButton').disabled = disabled;
    document.getElementById('loginUserButton').disabled = disabled;
    if (text) {
        document.getElementById('loginAdminButton').textContent = text;
        document.getElementById('loginUserButton').textContent = text;
    } else {
        document.getElementById('loginAdminButton').textContent = 'Masuk sebagai Administrator';
        document.getElementById('loginUserButton').textContent = 'Lihat Dashboard (User)';
    }
}

function handleLogin(role) {
    const nip = document.getElementById('nip').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const message = document.getElementById('message');

    if (!nip || !pin) {
        message.textContent = 'NIP dan PIN harus diisi.';
        return;
    }

    setButtonState(true, 'Memverifikasi...');
    message.textContent = '';

    // Cek otentikasi
    const isAdmin = ADMIN_CREDENTIALS.some(admin => admin.nip === nip && admin.pin === pin);
    const isUser = USER_CREDENTIALS.some(user => user.nip === nip && user.pin === pin);

    let redirectURL = null;
    let loginKey = null;

    if (role === 'admin' && isAdmin) {
        redirectURL = ADMIN_APP_URL;
        loginKey = 'isAdminLoggedIn';
    } else if (role === 'user' && (isAdmin || isUser)) { // Admin juga bisa login sebagai user
        redirectURL = USER_APP_URL;
        loginKey = 'isUserLoggedIn';
    }

    if (redirectURL) {
        message.textContent = 'Login Berhasil! Mengarahkan...';
        message.style.color = '#28a745';
        
        // Bersihkan status login lain dan simpan status baru
        localStorage.removeItem('isAdminLoggedIn');
        localStorage.removeItem('isUserLoggedIn');
        localStorage.setItem(loginKey, 'true'); 
        
        setTimeout(() => {
            window.location.href = redirectURL; 
        }, 1000);

    } else {
        message.textContent = 'NIP atau PIN salah atau tidak memiliki hak akses yang diminta.';
        message.style.color = '#dc3545';
        setButtonState(false);
    }
}
</script>
</body>
</html>
